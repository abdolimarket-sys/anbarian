name: Build APK

"on": [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci --registry https://registry.npmjs.org/
      - run: npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          SM=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -n 1)
          yes | "$SM" --licenses || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - run: npx cap sync android
      - name: APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: anbarin-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
